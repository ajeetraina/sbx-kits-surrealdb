schemaVersion: "1"
kind: mixin
name: surrealdb
displayName: SurrealDB (Gemini embedder)
description: "Adds an embedded, multi-model SurrealDB (documents, graph, and native vector search) plus the surrealdb Python SDK to any agent, with vector search embedded by Google Gemini. Store the key with: sbx secret set -g google (the kit holds no key)."

network:
  allowedDomains:
    - pypi.org
    - files.pythonhosted.org
    - raw.githubusercontent.com
    - github.com
    - release-assets.githubusercontent.com
    - generativelanguage.googleapis.com

environment:
  variables:
    GOOGLE_API_KEY: "placeholder"
    SURREALDB_URL: "surrealkv:///home/agent/.surrealdb/data"
    SURREALDB_NS: "sandbox"
    SURREALDB_DB: "memory"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

commands:
  install:
    - command: "pip install --break-system-packages 'surrealdb==2.0.0' google-genai"
      user: "1000"
      description: "Install the SurrealDB Python SDK (embedded storage engines bundled) plus the google-genai SDK for the Gemini embedder"
  initFiles:
    - path: /home/agent/.surrealdb/config.json
      mode: "0644"
      onlyIfMissing: true
      description: "SurrealDB connection + Gemini embedder config; key injected by sbx secret"
      content: |
        {
          "db": {
            "url": "surrealkv:///home/agent/.surrealdb/data",
            "namespace": "sandbox",
            "database": "memory_gemini"
          },
          "embedder": {
            "provider": "gemini",
            "model": "gemini-embedding-001",
            "dims": 768
          }
        }
memory: |
  ## SurrealDB (embedded, multi-model — Gemini embedder)

  The surrealdb Python SDK plus the google-genai SDK are installed. A full
  multi-model database (documents, graph, native vector search) runs in-process
  with no server and no external database. Vector search embeds text via Gemini
  (gemini-embedding-001, 768-dim). The API key is supplied by the sbx proxy from
  the stored google secret, so it is not present in the sandbox. On-disk store at
  ~/.surrealdb/data, config at ~/.surrealdb/config.json.
